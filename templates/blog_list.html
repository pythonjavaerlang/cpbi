{% extends "base.html" %}
{% block banner %}{% endblock %}
{% block content %}
<div class="header_logo"><div class="container">
    <a class="logo desktop" href="/{{ fixed.news }}/"><h1>Новини</h1></a>
</div></div>
<section id="useful-info"><div class="container">
    <div class="text-content">
        <ul>
            {% for e in entries %}
            <li><h3><a href="/{{ section.news }}/{{ e.slug }}/">{{ e.title }}</a></h3>
                {% if e.announcement %}<p>{{ e.announcement | safe }}</p>{% endif %}
                <span class="date">{{ e.date }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
</div><div class="clearfix"></div></section>
{% endblock %}
