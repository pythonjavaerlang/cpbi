{% extends "base.html" %}
{% block banner %}{% endblock %}
{% block content %}
<div class="header_logo"><div class="container">
    <a class="logo desktop" href="/{{ fixed.lecture }}/"><h1>Відео-лекції</h1></a>
</div></div>
<section id="useful-info" class="lectures"><div class="container">
    <div class="text-content">
        <p>Відео-лекції Чернівецького православного богословського інституту.
           Усі записи також доступні на нашому каналі
           <a href="https://www.youtube.com/@bohoslovskiyinstitut" target="_blank" rel="noopener">YouTube</a>.</p>
        <div style="position:relative;width:100%;max-width:860px;margin:1.5em auto;padding-bottom:56.25%;height:0;overflow:hidden;">
            <iframe style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"

                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
        </div>
    </div>
    <aside id="form-control">
        <div id="home-link"><a href="/">Дивись також</a></div>
        <nav><ul id="form-menu">
            <li><a href="/{{ fixed.library }}/">Бібліотека</a></li>
            <li><a href="/{{ fixed.bible }}/">Тлумачення Святого Письма</a></li>
        </ul></nav>
    </aside>
</div><div class="clearfix"></div></section>
