</div></div>
<section id="useful-info"><div class="container">

        <nav><ul id="form-menu">
            <li><a href="/{{ fixed.lecture }}/">Відео-лекції</a></li>
        </ul></nav>
    </aside>
</div><div class="clearfix"></div></section>
{% endblock %}
